name: 'Build & Typecheck Astro'
description: 'Installation des dépendances, typecheck (astro check) et build pour les projets Astro'

inputs:
  node-version:
    description: 'Version de Node.js'
    required: false
    default: '20'
  package-manager:
    description: 'Gestionnaire de paquets (npm ou yarn)'
    required: false
    default: 'npm'
  typecheck-script:
    description: 'Nom du script npm/yarn qui exécute `astro check`'
    required: false
    default: 'typecheck'
  build-script:
    description: 'Nom du script de build'
    required: false
    default: 'build'
  enable-tests:
    description: 'Exécuter un script de test après typecheck/build (false par défaut — les sites Astro observés dans le portefeuille n''ont pas de tests unitaires)'
    required: false
    default: 'false'
  test-script:
    description: 'Nom du script de test (si enable-tests=true)'
    required: false
    default: 'test'
  project-version:
    description: 'Version du projet'
    required: true
  fichier-json:
    description: 'Fichier JSON de version'
    required: false
    default: 'cicd.json'
  sonar-key:
    description: 'Clé du projet SonarQube (vide = pas de Sonar)'
    required: false
    default: ''
  sonar-host-url:
    description: 'URL du serveur SonarQube'
    required: false
    default: ''
  sonar-token:
    description: 'Token SonarQube'
    required: false
    default: ''
  artifact-retention-days:
    description: 'Nombre de jours de rétention des artefacts'
    required: false
    default: '30'

runs:
  using: 'composite'
  steps:
    - name: Mise à jour du fichier de version
      uses: jstrullu/cicd-templates/github-actions/actions/set-version-file@master
      with:
        fichier-json: ${{ inputs.fichier-json }}
        release-version: ${{ inputs.project-version }}

    - name: Installation de Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}

    - name: Installation des dépendances (npm)
      if: inputs.package-manager == 'npm'
      shell: bash
      run: npm ci

    - name: Installation des dépendances (yarn)
      if: inputs.package-manager == 'yarn'
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Mise à jour de la version package.json
      shell: bash
      run: npm version ${{ inputs.project-version }} --no-git-tag-version

    - name: Typecheck astro check (npm)
      if: inputs.package-manager == 'npm'
      shell: bash
      run: npm run ${{ inputs.typecheck-script }}

    - name: Typecheck astro check (yarn)
      if: inputs.package-manager == 'yarn'
      shell: bash
      run: yarn ${{ inputs.typecheck-script }}

    - name: Tests (npm)
      if: inputs.package-manager == 'npm' && inputs.enable-tests == 'true'
      shell: bash
      run: npm run ${{ inputs.test-script }}

    - name: Tests (yarn)
      if: inputs.package-manager == 'yarn' && inputs.enable-tests == 'true'
      shell: bash
      run: yarn ${{ inputs.test-script }}

    - name: Build astro build (npm)
      if: inputs.package-manager == 'npm'
      shell: bash
      run: npm run ${{ inputs.build-script }}

    - name: Build astro build (yarn)
      if: inputs.package-manager == 'yarn'
      shell: bash
      run: yarn ${{ inputs.build-script }}

    - name: Analyse SonarQube
      if: inputs.sonar-key != ''
      uses: SonarSource/sonarqube-scan-action@v3
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      with:
        args: >
          -Dsonar.projectKey=${{ inputs.sonar-key }}
          -Dsonar.sources=src
          -Dsonar.projectVersion=${{ inputs.project-version }}

    - name: Upload de l'artefact
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: ${{ github.workspace }}
        retention-days: ${{ inputs.artifact-retention-days }}
