name: '.NET Core Build & Test'
description: 'Restore, build, test, analyse SonarQube et couverture de code pour les projets .NET Core'

inputs:
  sonar-project-key:
    description: 'Clé du projet SonarQube'
    required: false
    default: ''
  project-file:
    description: 'Chemin du fichier .csproj principal'
    required: true
  project-version:
    description: 'Version du projet'
    required: true
  sonar-host-url:
    description: 'URL du serveur SonarQube'
    required: false
    default: ''
  sonar-token:
    description: 'Token d''authentification SonarQube'
    required: false
    default: ''
  dotnet-version:
    description: 'Version du SDK .NET'
    required: false
    default: '8.0.x'
  test-projects:
    description: 'Motifs glob des projets de tests, un par ligne (sensibles à la casse)'
    required: false
    default: |
      **/*Tests.*.csproj
      **/*.Tests.csproj
      **/*.tests.csproj
  fail-on-missing-tests:
    description: 'Échec si aucun projet de tests ne correspond à test-projects (avertissement sinon)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Installation du SDK .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Mise à jour de AssemblyVersion
      shell: bash
      run: |
        if [ -n "${{ inputs.project-file }}" ] && [ -f "${{ inputs.project-file }}" ]; then
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${{ inputs.project-version }}</AssemblyVersion>|g" "${{ inputs.project-file }}"
        fi

    - name: Installation de dotnet-sonarscanner
      if: inputs.sonar-project-key != ''
      shell: bash
      run: dotnet tool install --global dotnet-sonarscanner || true

    - name: SonarQube Begin
      if: inputs.sonar-project-key != ''
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        dotnet sonarscanner begin \
          /k:"${{ inputs.sonar-project-key }}" \
          /n:"${{ github.event.repository.name }}" \
          /v:"${{ inputs.project-version }}" \
          /d:sonar.host.url="${{ inputs.sonar-host-url }}" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" || true

    - name: Restore
      shell: bash
      run: dotnet restore **/*.csproj --no-cache

    - name: Build
      shell: bash
      run: dotnet build --no-restore -c Release

    - name: Tests unitaires (coverlet.collector, cross-platform)
      shell: bash
      # XPlat Code Coverage = coverlet.collector, fonctionne sur Linux/macOS/Windows
      # (contrairement à l'ancien collecteur VSTest "Code coverage", Windows-only —
      # cassant sur ubuntu-latest, le runner par défaut de ce repo).
      # Nécessite que le projet de tests consommateur référence coverlet.collector.
      #
      # LIMITE CONNUE : coverlet.collector n'est PAS compatible avec le Microsoft
      # Testing Platform (MTP) — il repose sur l'infrastructure VSTest data collector,
      # que MTP ne supporte pas. Sur un projet MTP, la couverture est silencieusement
      # vide (pas d'erreur). Si c'est votre cas, cette action ne convient pas telle quelle.
      #
      # Un `dotnet test` par projet trouvé : la CLI n'accepte qu'un projet par appel.
      env:
        TEST_PROJECTS: ${{ inputs.test-projects }}
        FAIL_ON_MISSING_TESTS: ${{ inputs.fail-on-missing-tests }}
      run: |
        shopt -s globstar nullglob
        found=()
        while IFS= read -r pattern; do
          pattern="${pattern//[[:space:]]/}"
          [ -z "$pattern" ] && continue
          for project in $pattern; do
            found+=("$project")
          done
        done <<< "$TEST_PROJECTS"
        if [ ${#found[@]} -eq 0 ]; then
          message="Aucun projet de tests ne correspond à l'input test-projects : aucun test n'est exécuté."
          if [ "${FAIL_ON_MISSING_TESTS,,}" = 'true' ]; then
            echo "::error::$message"
            exit 1
          fi
          echo "::warning::$message"
          exit 0
        fi
        mapfile -t projects < <(printf '%s\n' "${found[@]}" | sort -u)
        for project in "${projects[@]}"; do
          echo "Tests de $project"
          dotnet test "$project" \
            --no-build -c Release \
            --logger "trx;LogFileName=TEST.xml" \
            --collect:"XPlat Code Coverage;Format=cobertura,opencover" || true
        done

    - name: SonarQube End
      if: inputs.sonar-project-key != ''
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN" || true

    - name: Installation de ReportGenerator
      shell: bash
      run: dotnet tool install --global dotnet-reportgenerator-globaltool || true

    - name: Génération du rapport de couverture
      shell: bash
      run: |
        coverage_files=$(find . -name "coverage.opencover.xml" -type f | tr '\n' ';')
        if [ -n "$coverage_files" ]; then
          reportgenerator \
            -reports:"$coverage_files" \
            -targetdir:"./coveragereport" \
            -verbosity:Error || true
        fi
