# Pipeline Astro — Copier dans .github/workflows/ du repo consommateur
# Variables à configurer dans la section env ci-dessous.
#
# Pas de stage Docker/deploy par défaut : la plupart des sites Astro du
# portefeuille sont statiques ou servis via un adaptateur léger (Node) —
# étendre ce fichier si un déploiement conteneurisé est nécessaire (voir
# node_pipeline.yml pour le motif docker-build-and-publish/deploy-to-dev).
name: Astro Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  VERSION_INCREMENT: 'patch'
  FICHIER_JSON: 'cicd.json'
  NODE_VERSION: '20'
  PACKAGE_MANAGER: 'npm'      # npm ou yarn
  TYPECHECK_SCRIPT: 'typecheck'   # script npm/yarn qui exécute `astro check`
  BUILD_SCRIPT: 'build'
  ENABLE_TESTS: 'false'       # la plupart des sites Astro du portefeuille n'ont pas de tests unitaires
  TEST_SCRIPT: 'test'
  SONAR_KEY: ''                # Clé du projet SonarQube

jobs:
  initialisation:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versionnement sémantique
        id: versioning
        uses: jstrullu/cicd-templates/github-actions/actions/semantic-version@master
        with:
          version-increment: ${{ env.VERSION_INCREMENT }}
          fichier-json: ${{ env.FICHIER_JSON }}

  build-and-typecheck:
    runs-on: ubuntu-latest
    needs: initialisation
    steps:
      - uses: actions/checkout@v4
      - name: Build & Typecheck Astro
        uses: jstrullu/cicd-templates/github-actions/actions/astro/build-test@master
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager: ${{ env.PACKAGE_MANAGER }}
          typecheck-script: ${{ env.TYPECHECK_SCRIPT }}
          build-script: ${{ env.BUILD_SCRIPT }}
          enable-tests: ${{ env.ENABLE_TESTS }}
          test-script: ${{ env.TEST_SCRIPT }}
          project-version: ${{ needs.initialisation.outputs.version }}
          fichier-json: ${{ env.FICHIER_JSON }}
          sonar-key: ${{ env.SONAR_KEY }}
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  finalisation:
    runs-on: ubuntu-latest
    needs: [initialisation, build-and-typecheck]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalisation
        uses: jstrullu/cicd-templates/github-actions/actions/finalisation@master
        with:
          release-version: ${{ needs.initialisation.outputs.version }}
          fichier-json: ${{ env.FICHIER_JSON }}
          language: 'node'
