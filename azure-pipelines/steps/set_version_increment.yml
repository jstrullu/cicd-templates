# Resolves the version increment, honoring a "#VERSION major|minor|patch"
# override in the merged pull request title. Uses System.AccessToken against
# the Azure DevOps REST API directly: no service connection, no marketplace
# tasks. Falls back to the default increment when no PR or no override exists.
parameters:
  - name: versionIncrement
    type: string

steps:
  - bash: |
      INCREMENT='${{ parameters.versionIncrement }}'
      echo "##vso[task.setvariable variable=versionIncrement;]$INCREMENT"
      echo "##vso[task.setvariable variable=versionIncrementFromPR;]"
      RESP=$(curl -sf -u ":$SYSTEM_ACCESSTOKEN" -H "Content-Type: application/json" -X POST \
        -d '{"queries":[{"type":"lastMergeCommit","items":["'"$BUILD_SOURCEVERSION"'"]}]}' \
        "${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECT}/_apis/git/repositories/${BUILD_REPOSITORY_ID}/pullrequestquery?api-version=7.1") \
        || { echo "PR query failed; using default increment '$INCREMENT'"; exit 0; }
      TITLE=$(echo "$RESP" | jq -r --arg sha "$BUILD_SOURCEVERSION" '.results[0][$sha][0].title // empty' 2>/dev/null)
      if [ -z "$TITLE" ]; then
        echo "No pull request found for $BUILD_SOURCEVERSION; using default increment '$INCREMENT'"
        exit 0
      fi
      echo "Pull request title: $TITLE"
      BUMP=$(echo "$TITLE" | tr '[:lower:]' '[:upper:]' | sed -n 's/.*#VERSION[[:space:]]*\([A-Z]*\).*/\1/p' | tr '[:upper:]' '[:lower:]')
      case "$BUMP" in
        major|minor|patch)
          echo "PR title override: $BUMP"
          echo "##vso[task.setvariable variable=versionIncrement;]$BUMP"
          echo "##vso[task.setvariable variable=versionIncrementFromPR;]$BUMP"
          ;;
        *)
          echo "No #VERSION override in PR title; using default increment '$INCREMENT'"
          ;;
      esac
    displayName: 'Resolve version increment (PR title #VERSION override)'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
