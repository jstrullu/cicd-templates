parameters:
  - name: jsonFile
    type: string
  - name: releaseVersion
    type: string

steps:
  - bash: |
      cd "$(Build.SourcesDirectory)"
      test -f "${{ parameters.jsonFile }}" || echo '{"version": "0.0.0"}' > "${{ parameters.jsonFile }}"
      # ponytail: sed on controlled version file ({"version": "..."}); switch to jq if the file grows structure
      sed -i 's/"version": *"[^"]*"/"version": "${{ parameters.releaseVersion }}"/' "${{ parameters.jsonFile }}"
      git add "${{ parameters.jsonFile }}"
      cat "${{ parameters.jsonFile }}"
    displayName: Set version ${{ parameters.releaseVersion }} in ${{ parameters.jsonFile }}
