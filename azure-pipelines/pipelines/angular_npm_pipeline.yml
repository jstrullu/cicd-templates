trigger:
  - master

parameters:
  - name: appName
    displayName: Application name
    type: string
    default: $(Build.Repository.Name)
  - name: jsonFile
    type: string
    default: cicd.json
  - name: versionIncrement
    type: string
    default: 'patch'
  - name: gitFlowType
    displayName: Git flow strategy
    type: string
    default: github-flow
    values:
      - github-flow
      - gitflow
      - trunk-based
      - gitlab-flow
  - name: developIncrement
    displayName: Version increment for develop branch (gitflow)
    type: string
    default: patch
  - name: releaseIncrement
    displayName: Version increment for release branches (gitflow)
    type: string
    default: minor
  - name: hotfixIncrement
    displayName: Version increment for hotfix branches (gitflow)
    type: string
    default: patch
  - name: versioningStrategy
    displayName: Versioning strategy
    type: string
    default: semver
    values:
      - semver
      - git-sha
  - name: sonarKey
    type: string
    default: ''
  - name: dockerRegistry
    type: string
  - name: containerRegistry
    type: string
  # service-connection (default): Docker@2 task, needs an Azure DevOps
  #   containerRegistry service connection — unchanged behavior.
  # insecure-cli: docker build/push CLI direct against an in-cluster/self-hosted
  #   registry with no service connection, matching every real consumer
  #   pipeline in the org's portfolio (docker build + docker push, no login).
  - name: dockerPushMode
    displayName: Docker push mode
    type: string
    default: service-connection
    values:
      - service-connection
      - insecure-cli
  - name: dockerImageName
    displayName: Image name for insecure-cli mode (defaults to appName)
    type: string
    default: ''
  - name: dockerAlsoTagLatest
    displayName: Also push :latest (insecure-cli mode)
    type: boolean
    default: true
  - name: insecureRegistryUrl
    displayName: Configure this registry as insecure on the agent (insecure-cli mode, leave empty if already configured)
    type: string
    default: ''
  # kube-manifest (default): KubernetesManifest@0 task, needs a Kubernetes-type
  #   Azure DevOps environment resource (kubeconfig) — unchanged behavior.
  # helm: helm upgrade --install direct on an agent already inside the target
  #   cluster (no kubeconfig needed), matching every real consumer pipeline
  #   in the org's portfolio.
  - name: deployMode
    displayName: Deploy mode
    type: string
    default: kube-manifest
    values:
      - kube-manifest
      - helm
  - name: helmChartPath
    displayName: Path to the Helm chart (helm mode)
    type: string
    default: ''
  - name: helmValuesFile
    displayName: Path to the Helm values file (helm mode)
    type: string
    default: ''
  - name: helmSetValues
    displayName: Extra --set-string KEY=VALUE pairs, one per line (helm mode)
    type: string
    default: ''
  - name: enableMutationTesting
    displayName: Enable mutation testing
    type: boolean
    default: false
  - name: enableSecurityChecks
    displayName: Enable security checks
    type: boolean
    default: false
  - name: securityTargetFile
    displayName: Target file for Snyk (e.g. package.json)
    type: string
    default: 'package.json'

stages:
  - stage: Initialization
    jobs:
      - template: /jobs/json_semantic_version.yml
        parameters:
          versionIncrement: ${{ parameters.versionIncrement }}
          jsonFile: ${{ parameters.jsonFile }}
          gitFlowType: ${{ parameters.gitFlowType }}
          developIncrement: ${{ parameters.developIncrement }}
          releaseIncrement: ${{ parameters.releaseIncrement }}
          hotfixIncrement: ${{ parameters.hotfixIncrement }}
          versioningStrategy: ${{ parameters.versioningStrategy }}

  - stage: Build_And_Test
    dependsOn: Initialization
    variables:
      version: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
    jobs:
      - template: /jobs/angular/angular_test_and_build.yml
        parameters:
          sonarKey: ${{ parameters.sonarKey }}
          projectVersion: $(version)
          jsonFile: ${{ parameters.jsonFile }}
      - ${{ if eq(parameters.enableMutationTesting, true) }}:
        - template: /jobs/angular/angular_mutation_test.yml
          parameters:
            projectVersion: $(version)
            jsonFile: ${{ parameters.jsonFile }}

  - stage: Lint
    dependsOn:
      - Initialization
      - Build_And_Test
    variables:
      version: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
    jobs:
      - template: /jobs/angular/angular_linter.yml
        parameters:
          projectVersion: $(version)

  - ${{ if eq(parameters.enableSecurityChecks, true) }}:
    - stage: Security_Checks
      dependsOn: Initialization
      jobs:
        - template: /jobs/angular/security_checks.yml
          parameters:
            targetFile: ${{ parameters.securityTargetFile }}

  - stage: Docker_Build_And_Publish
    condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldDeploy'], 'true'))
    variables:
      version: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
    dependsOn:
      - Initialization
      - Build_And_Test
      - Lint
    jobs:
      - ${{ if eq(parameters.dockerPushMode, 'service-connection') }}:
        - template: /jobs/docker_build_and_publish.yml
          parameters:
            registry: ${{ parameters.dockerRegistry }}
            containerRegistry: ${{ parameters.containerRegistry }}
            projectVersion: $(version)
      - ${{ if eq(parameters.dockerPushMode, 'insecure-cli') }}:
        - template: /jobs/docker_build_push_insecure.yml
          parameters:
            registry: ${{ parameters.dockerRegistry }}
            imageName: ${{ coalesce(parameters.dockerImageName, parameters.appName) }}
            projectVersion: $(version)
            alsoTagLatest: ${{ parameters.dockerAlsoTagLatest }}
            insecureRegistryUrl: ${{ parameters.insecureRegistryUrl }}

  - stage: Deploy
    condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldDeploy'], 'true'))
    dependsOn:
      - Initialization
      - Build_And_Test
      - Lint
      - Docker_Build_And_Publish
    variables:
      BUILDID: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
      deployEnv: $[stageDependencies.Initialization.Versioning.outputs['gitflow.deployEnvironment']]
    jobs:
      - ${{ if eq(parameters.deployMode, 'kube-manifest') }}:
        - template: /jobs/kube_deploy.yml
          parameters:
            env: $(deployEnv)
            resource: ${{ parameters.appName }}
            namespace: ${{ parameters.appName }}
      - ${{ if eq(parameters.deployMode, 'helm') }}:
        - template: /jobs/helm_deploy.yml
          parameters:
            releaseName: ${{ parameters.appName }}
            namespace: ${{ parameters.appName }}
            chartPath: ${{ parameters.helmChartPath }}
            valuesFile: ${{ parameters.helmValuesFile }}
            imageTag: $(BUILDID)
            setValues: ${{ parameters.helmSetValues }}

  - stage: Finalization
    condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldFinalize'], 'true'))
    dependsOn:
      - Initialization
      - Build_And_Test
      - Lint
      - Docker_Build_And_Publish
      - Deploy
    variables:
      version: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
      shouldTag: $[stageDependencies.Initialization.Versioning.outputs['gitflow.shouldTag']]
    jobs:
      - template: /jobs/finalisation.yml
        parameters:
          releaseVersion: $(version)
          jsonFile: ${{ parameters.jsonFile }}
          language: 'angular'
          shouldTag: $(shouldTag)