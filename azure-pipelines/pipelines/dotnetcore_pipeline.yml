trigger:
  - master

parameters:
  - name: appName
    displayName: Application name
    type: string
    default: $(Build.Repository.Name)
  - name: jsonFile
    type: string
    default: cicd.json
  - name: versionIncrement
    type: string
    default: 'patch'
  - name: gitFlowType
    displayName: Git flow strategy
    type: string
    default: github-flow
    values:
      - github-flow
      - gitflow
      - trunk-based
      - gitlab-flow
  - name: developIncrement
    displayName: Version increment for develop branch (gitflow)
    type: string
    default: patch
  - name: releaseIncrement
    displayName: Version increment for release branches (gitflow)
    type: string
    default: minor
  - name: hotfixIncrement
    displayName: Version increment for hotfix branches (gitflow)
    type: string
    default: patch
  - name: versioningStrategy
    displayName: Versioning strategy
    type: string
    default: semver
    values:
      - semver
      - git-sha
  - name: sonarKey
    type: string
    default: ''
  - name: securityTargetDir
    type: string
  - name: projectFile
    type: string
  - name: dockerRegistry
    type: string
  - name: containerRegistry
    type: string
  # service-connection (default): Docker@2 task, needs an Azure DevOps
  #   containerRegistry service connection — unchanged behavior.
  # insecure-cli: docker build/push CLI direct against an in-cluster/self-hosted
  #   registry with no service connection, matching every real consumer
  #   pipeline in the org's portfolio (docker build + docker push, no login).
  - name: dockerPushMode
    displayName: Docker push mode
    type: string
    default: service-connection
    values:
      - service-connection
      - insecure-cli
  - name: dockerImageName
    displayName: Image name for insecure-cli mode (defaults to appName)
    type: string
    default: ''
  # Multi-image variant of insecure-cli — leave empty for the mono-image
  # behavior above. When set, dockerImageName is ignored: images are named
  # {appName}-{item.name}. See docker_build_push_insecure_multi.yml for the
  # full schema (name/dockerfile/context/target/buildArgs per entry).
  - name: dockerImages
    displayName: Multiple images to build/push (insecure-cli mode) — overrides dockerImageName when non-empty
    type: object
    default: []
  - name: dockerAlsoTagLatest
    displayName: Also push :latest (insecure-cli mode)
    type: boolean
    default: true
  - name: insecureRegistryUrl
    displayName: Configure this registry as insecure on the agent (insecure-cli mode, leave empty if already configured)
    type: string
    default: ''
  - name: dockerBuildArgs
    displayName: Extra --build-arg KEY=VALUE pairs, one per line (mono-image insecure-cli mode)
    type: string
    default: ''
  # kube-manifest (default): KubernetesManifest@0 task, needs a Kubernetes-type
  #   Azure DevOps environment resource (kubeconfig) — unchanged behavior.
  # helm: helm upgrade --install direct on an agent already inside the target
  #   cluster (no kubeconfig needed), matching every real consumer pipeline
  #   in the org's portfolio.
  - name: deployMode
    displayName: Deploy mode
    type: string
    default: kube-manifest
    values:
      - kube-manifest
      - helm
  - name: helmChartPath
    displayName: Path to the Helm chart (helm mode)
    type: string
    default: ''
  - name: helmValuesFile
    displayName: Path to the Helm values file (helm mode)
    type: string
    default: ''
  - name: helmSetValues
    displayName: Extra --set-string KEY=VALUE pairs, one per line (helm mode)
    type: string
    default: ''
  # Sandbox -> Prod, same image tag reused between the two, gated by manual
  # approval on prodApprovalEnvironment. Scoped to deployMode: 'helm' only —
  # both real consumers of this pattern in the org's portfolio (paymenthub,
  # ShopTemplate) use Helm. Ignored (falls back to the single Deploy stage
  # above) when deployMode is 'kube-manifest'.
  - name: enableStagedDeploy
    displayName: Enable Sandbox -> Prod staged deploy with manual approval (helm mode only)
    type: boolean
    default: false
  - name: sandboxNamespace
    displayName: Namespace/release for the sandbox stage (staged deploy, defaults to {appName}-sandbox)
    type: string
    default: ''
  - name: sandboxHelmValuesFile
    displayName: Values file for the sandbox stage (staged deploy, defaults to helmValuesFile)
    type: string
    default: ''
  - name: sandboxHelmSetValues
    displayName: --set-string pairs for the sandbox stage (staged deploy, defaults to helmSetValues)
    type: string
    default: ''
  - name: prodApprovalEnvironment
    displayName: Azure DevOps environment carrying the approval check for Prod (staged deploy — required when enableStagedDeploy is true)
    type: string
    default: ''
  - name: enableMutationTesting
    displayName: Enable mutation testing
    type: boolean
    default: false
  - name: enableSecurityChecks
    displayName: Enable security checks
    type: boolean
    default: false
  - name: securityTargetFile
    displayName: Target file for Snyk (e.g. *.csproj)
    type: string
    default: ''

stages:
  - stage: Initialization
    jobs:
      - template: /jobs/json_semantic_version.yml
        parameters:
          versionIncrement: ${{ parameters.versionIncrement }}
          jsonFile: ${{ parameters.jsonFile }}
          gitFlowType: ${{ parameters.gitFlowType }}
          developIncrement: ${{ parameters.developIncrement }}
          releaseIncrement: ${{ parameters.releaseIncrement }}
          hotfixIncrement: ${{ parameters.hotfixIncrement }}
          versioningStrategy: ${{ parameters.versioningStrategy }}

  - stage: BuildAndTest
    displayName: 'Build Test and Sonar'
    dependsOn: Initialization
    variables:
      version: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
    jobs:
      - template: /jobs/dotnetcore/dotnetcore_build_test.yml
        parameters:
          sonarProjectKey: ${{parameters.sonarKey}}
          projectFile: ${{ parameters.projectFile }}
          projectVersion: $(version)
          jsonFile: ${{ parameters.jsonFile }}
      - ${{ if eq(parameters.enableMutationTesting, true) }}:
        - template: /jobs/dotnetcore/dotnetcore_mutation_test.yml
          parameters:
            projectFile: ${{ parameters.projectFile }}
            projectVersion: $(version)
            jsonFile: ${{ parameters.jsonFile }}

  - ${{ if eq(parameters.enableSecurityChecks, true) }}:
    - stage: Security_Checks
      dependsOn: Initialization
      jobs:
        - template: /jobs/dotnetcore/security_checks.yml
          parameters:
            targetFile: ${{ parameters.securityTargetFile }}

  - stage: Docker_Build_And_Publish
    condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldDeploy'], 'true'))
    variables:
      version: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
    dependsOn:
      - Initialization
      - BuildAndTest
    jobs:
      - ${{ if eq(parameters.dockerPushMode, 'service-connection') }}:
        - template: /jobs/docker_build_and_publish.yml
          parameters:
            registry: ${{ parameters.dockerRegistry }}
            containerRegistry: ${{ parameters.containerRegistry }}
            projectVersion: $(version)
      - ${{ if and(eq(parameters.dockerPushMode, 'insecure-cli'), eq(length(parameters.dockerImages), 0)) }}:
        - template: /jobs/docker_build_push_insecure.yml
          parameters:
            registry: ${{ parameters.dockerRegistry }}
            imageName: ${{ coalesce(parameters.dockerImageName, parameters.appName) }}
            projectVersion: $(version)
            alsoTagLatest: ${{ parameters.dockerAlsoTagLatest }}
            insecureRegistryUrl: ${{ parameters.insecureRegistryUrl }}
            buildArgs: ${{ parameters.dockerBuildArgs }}
      - ${{ if and(eq(parameters.dockerPushMode, 'insecure-cli'), ne(length(parameters.dockerImages), 0)) }}:
        - template: /jobs/docker_build_push_insecure_multi.yml
          parameters:
            registry: ${{ parameters.dockerRegistry }}
            appName: ${{ parameters.appName }}
            projectVersion: $(version)
            alsoTagLatest: ${{ parameters.dockerAlsoTagLatest }}
            insecureRegistryUrl: ${{ parameters.insecureRegistryUrl }}
            dockerImages: ${{ parameters.dockerImages }}

  - ${{ if or(eq(parameters.enableStagedDeploy, false), ne(parameters.deployMode, 'helm')) }}:
    - stage: Deploy
      condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldDeploy'], 'true'))
      dependsOn:
        - Initialization
        - BuildAndTest
        - Docker_Build_And_Publish
      variables:
        BUILDID: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
        deployEnv: $[stageDependencies.Initialization.Versioning.outputs['gitflow.deployEnvironment']]
      jobs:
        - ${{ if eq(parameters.deployMode, 'kube-manifest') }}:
          - template: /jobs/kube_deploy.yml
            parameters:
              env: $(deployEnv)
              resource: ${{ parameters.appName }}
              namespace: ${{ parameters.appName }}
        - ${{ if eq(parameters.deployMode, 'helm') }}:
          - template: /jobs/helm_deploy.yml
            parameters:
              releaseName: ${{ parameters.appName }}
              namespace: ${{ parameters.appName }}
              chartPath: ${{ parameters.helmChartPath }}
              valuesFile: ${{ parameters.helmValuesFile }}
              imageTag: $(BUILDID)
              setValues: ${{ parameters.helmSetValues }}

  - ${{ if and(eq(parameters.enableStagedDeploy, true), eq(parameters.deployMode, 'helm')) }}:
    - stage: Deploy_Sandbox
      displayName: 'Deploy Sandbox'
      condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldDeploy'], 'true'))
      dependsOn:
        - Initialization
        - BuildAndTest
        - Docker_Build_And_Publish
      variables:
        BUILDID: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
      jobs:
        - template: /jobs/helm_deploy.yml
          parameters:
            releaseName: ${{ coalesce(parameters.sandboxNamespace, format('{0}-sandbox', parameters.appName)) }}
            namespace: ${{ coalesce(parameters.sandboxNamespace, format('{0}-sandbox', parameters.appName)) }}
            chartPath: ${{ parameters.helmChartPath }}
            valuesFile: ${{ coalesce(parameters.sandboxHelmValuesFile, parameters.helmValuesFile) }}
            imageTag: $(BUILDID)
            setValues: ${{ coalesce(parameters.sandboxHelmSetValues, parameters.helmSetValues) }}

    - stage: Deploy_Prod
      displayName: 'Deploy Production'
      condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldDeploy'], 'true'))
      dependsOn:
        - Initialization
        - BuildAndTest
        - Docker_Build_And_Publish
        - Deploy_Sandbox
      variables:
        BUILDID: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
      jobs:
        - template: /jobs/helm_deploy_gated.yml
          parameters:
            releaseName: ${{ parameters.appName }}
            namespace: ${{ parameters.appName }}
            chartPath: ${{ parameters.helmChartPath }}
            valuesFile: ${{ parameters.helmValuesFile }}
            imageTag: $(BUILDID)
            setValues: ${{ parameters.helmSetValues }}
            approvalEnvironment: ${{ parameters.prodApprovalEnvironment }}

  - stage: Finalization
    displayName: 'Finalization'
    condition: and(succeeded(), eq(dependencies.Initialization.outputs['Versioning.gitflow.shouldFinalize'], 'true'))
    dependsOn:
      - Initialization
      - BuildAndTest
      - Docker_Build_And_Publish
      - ${{ if or(eq(parameters.enableStagedDeploy, false), ne(parameters.deployMode, 'helm')) }}:
        - Deploy
      - ${{ if and(eq(parameters.enableStagedDeploy, true), eq(parameters.deployMode, 'helm')) }}:
        - Deploy_Prod
    variables:
      version: $[stageDependencies.Initialization.Versioning.outputs['version.DockerTag']]
      shouldTag: $[stageDependencies.Initialization.Versioning.outputs['gitflow.shouldTag']]
    jobs:
      - template: /jobs/finalisation.yml
        parameters:
          releaseVersion: $(version)
          jsonFile: ${{ parameters.jsonFile }}
          language: '.net'
          shouldTag: $(shouldTag)