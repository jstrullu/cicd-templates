parameters:
  - name: sonarProjectKey
    type: string
    default: ''
  - name: projectFile
    type: string
  - name: projectVersion
    type: string
  - name: jsonFile
    type: string
    default: 'cicd.json'
  - name: sonarConnection
    type: string
    default: Sonar
  - name: pool
    type: string
    default: 'Self-Hosted-K3s'
  # Motifs glob des projets de tests, un par ligne, passés tels quels à `dotnet test`.
  # Le défaut garde l'ancien motif (*Tests.*.csproj) et ajoute *.Tests.csproj et
  # *.tests.csproj : la recherche est sensible à la casse sur les agents Linux.
  - name: testProjects
    type: string
    default: |
      **/*Tests.*.csproj
      **/*.Tests.csproj
      **/*.tests.csproj
  # Aucun projet de tests trouvé : avertissement (défaut, le job finit en
  # « succeededWithIssues ») ou échec du job si true.
  - name: failOnMissingTests
    type: boolean
    default: false

jobs:
  - job: BuildAndTest
    pool:
      name: ${{ parameters.pool }}
    timeoutInMinutes: 30
    steps:
      - checkout: self
        clean: true
        persistCredentials: true
      - template: ../../steps/set_version_file.yml
        parameters:
          jsonFile: ${{ parameters.jsonFile }}
          releaseVersion: ${{ parameters.projectVersion }}
      # Bash plutôt que PowerShell : pwsh n'est pas installé sur les agents auto-hébergés Linux.
      # Seule la partie numérique de la version (sans suffixe -rc, -SNAPSHOT…) est valide pour AssemblyVersion.
      - bash: |
          PROJECT_FILE='${{ parameters.projectFile }}'
          VERSION='${{ parameters.projectVersion }}'
          ASSEMBLY_VERSION="${VERSION%%-*}"
          if ! echo "$ASSEMBLY_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Version '$VERSION' non numérique (stratégie git-sha ?) : AssemblyVersion inchangée"
          elif grep -q '<AssemblyVersion>' "$PROJECT_FILE"; then
            sed -i "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$ASSEMBLY_VERSION</AssemblyVersion>|" "$PROJECT_FILE"
            grep '<AssemblyVersion>' "$PROJECT_FILE"
          else
            echo "Pas de <AssemblyVersion> dans $PROJECT_FILE : rien à mettre à jour"
          fi
        displayName: 'Assembly Version Generation'
      
      - ${{ if ne(parameters.sonarProjectKey, '') }}:
        - task: SonarQubePrepare@5
          displayName: 'Prepare Sonar'
          inputs:
            SonarQube: '${{ parameters.sonarConnection }}'
            scannerMode: 'MSBuild'
            projectKey: ${{ parameters.sonarProjectKey }}
            projectName: $(Build.Repository.Name)
            projectVersion: ${{ parameters.projectVersion }}
            extraProperties: |
              sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
      - task: Cache@2
        displayName: 'Cache NuGet packages'
        inputs:
          key: 'nuget | "$(Agent.OS)" | **/*.csproj'
          restoreKeys: 'nuget | "$(Agent.OS)"'
          path: '$(Pipeline.Workspace)/.nuget/packages'

      - task: DotNetCoreCLI@2
        displayName: 'Restore'
        inputs:
          command: restore
          projects: '**/*.csproj'
      - task: DotNetCoreCLI@2
        displayName: 'Build'
        inputs:
          projects: '**/*.csproj'
          arguments: '--no-restore -c Release'
      # Même résolution des motifs que la tâche de tests (globstar, sensible à la casse) :
      # rend visible l'absence de projet de tests au lieu de la laisser passer en silence.
      - bash: |
          shopt -s globstar nullglob
          found=()
          while IFS= read -r pattern; do
            pattern="${pattern//[[:space:]]/}"
            [ -z "$pattern" ] && continue
            for project in $pattern; do
              found+=("$project")
            done
          done <<'MOTIFS'
          ${{ parameters.testProjects }}
          MOTIFS
          if [ ${#found[@]} -eq 0 ]; then
            echo "##vso[task.setvariable variable=testProjectsFound]false"
            message="Aucun projet de tests ne correspond au paramètre testProjects : aucun test n'est exécuté."
            failOnMissingTests='${{ parameters.failOnMissingTests }}'
            if [ "${failOnMissingTests,,}" = 'true' ]; then
              echo "##vso[task.logissue type=error]$message"
              exit 1
            fi
            echo "##vso[task.logissue type=warning]$message"
            echo "##vso[task.complete result=SucceededWithIssues;]"
          else
            echo "##vso[task.setvariable variable=testProjectsFound]true"
            echo "Projets de tests trouvés :"
            printf '  %s\n' "${found[@]}" | sort -u
          fi
        displayName: 'Recherche des projets de tests'
      - task: DotNetCoreCLI@2
        displayName: 'Unit tests (coverlet.collector, cross-platform)'
        inputs:
          command: 'test'
          projects: ${{ parameters.testProjects }}
          # XPlat Code Coverage = coverlet.collector, works on Linux/macOS/Windows
          # (unlike the old VSTest "Code coverage" collector, Windows-only).
          # Requires the consumer's test project to reference coverlet.collector.
          # cobertura feeds ReportGenerator/PublishCodeCoverageResults below,
          # opencover feeds the optional Sonar step.
          #
          # KNOWN LIMITATION: coverlet.collector is NOT compatible with the
          # Microsoft Testing Platform (MTP, opt-in via <TestingPlatformDotnetTestSupport>
          # or enabled by some .NET 10 project templates) — it relies on the VSTest
          # data collector infrastructure, which MTP does not support. On an MTP
          # project this collects nothing silently (no error, empty coverage).
          # If that's your setup, this job is not the right fit as-is.
          arguments: '--no-build -c Release --logger trx;LogFileName=TEST.xml --collect:"XPlat Code Coverage;Format=cobertura,opencover"'
          publishTestResults: false
      # ReportGenerator sort en code 1 quand -reports: est vide : il ne tourne, ni la
      # publication de couverture, que si des fichiers de couverture existent.
      - bash: |
          files=$(find "$PWD" -name coverage.opencover.xml -type f -print0 | tr '\0' ';')
          if [ -n "$files" ]; then
            echo "$files"
            echo "##vso[task.setvariable variable=coverageFiles]$files"
            echo "##vso[task.setvariable variable=hasCoverageFiles]true"
          else
            echo "##vso[task.setvariable variable=hasCoverageFiles]false"
            message="Aucun fichier coverage.opencover.xml : ReportGenerator et la publication de couverture sont ignorés."
            if [ "${TESTPROJECTSFOUND:-}" = 'true' ]; then
              echo "##vso[task.logissue type=warning]$message Les projets de tests doivent référencer coverlet.collector."
            else
              echo "$message"
            fi
          fi
        displayName: 'Get coverage files path'
      - task: PublishTestResults@2
        displayName: 'Publish Test Results'
        inputs:
          testResultsFormat: 'VSTest'
          testResultsFiles: '**/TEST*.xml'
          testRunTitle: 'Unit Tests'
          mergeTestResults: true
          condition: succeededOrFailed()
      - ${{ if ne(parameters.sonarProjectKey, '') }}:
        - task: SonarQubeAnalyze@5
          displayName: 'Sonar analysis'
        - task: SonarQubePublish@5
          displayName: 'Publish sonar'
          inputs:
            pollingTimeoutSec: '300'
      - task: reportgenerator@5
        displayName: 'Report Generator'
        condition: and(succeeded(), eq(variables['hasCoverageFiles'], 'true'))
        continueOnError: true
        inputs:
          reports: '$(coverageFiles)'
          targetdir: './coveragereport'
          verbosity: Error
      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage'
        condition: and(succeeded(), eq(variables['hasCoverageFiles'], 'true'))
        inputs:
          codeCoverageTool: Cobertura
          summaryFileLocation: './coveragereport/Cobertura.xml'
          reportDirectory: './coveragereport'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish artifact'
        inputs:
          targetPath: '$(Build.SourcesDirectory)'
          artifact: 'drop'
          publishLocation: 'pipeline'