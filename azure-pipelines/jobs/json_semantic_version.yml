# Takes the versionIncrement variable and the JSON file to update as parameters
# This job handles version bumping, git tagging, and pipeline naming in Azure DevOps
# Additionally, the semantic version branch-major.minor.patch is persisted in the DockerTag variable for subsequent stages
#
# Git flow context outputs (from the gitflow step):
#   Versioning.gitflow.shouldDeploy      — "true" if this branch should trigger deployment
#   Versioning.gitflow.deployEnvironment — target environment: dev, staging, or production
#   Versioning.gitflow.shouldTag         — "true" if a git tag should be created
#   Versioning.gitflow.shouldFinalize    — "true" if version commit + push should happen
#   Versioning.gitflow.versionSuffix     — suffix for pre-releases (e.g. -SNAPSHOT, -rc)
#   Versioning.gitflow.versionIncrement  — resolved bump level, or "none" to skip bumping
parameters:
  - name: versionIncrement
    type: string
    default: patch
  - name: jsonFile
    type: string
  - name: gitFlowType
    type: string
    default: github-flow
    values:
      - github-flow
      - gitflow
      - trunk-based
      - gitlab-flow
  - name: developIncrement
    type: string
    default: patch
  - name: releaseIncrement
    type: string
    default: minor
  - name: hotfixIncrement
    type: string
    default: patch
  # semver (default): cicd.json + PR title override (#VERSION major/minor/patch).
  #   The PR-title override needs a PR-based flow to do anything useful.
  # git-sha: tag = short git SHA (git rev-parse --short=7 HEAD), no cicd.json
  #   read/write, no git tag, no Finalization commit. Matches what every real
  #   consumer pipeline in this repo's portfolio actually does today, and
  #   works with pr: none / trigger-only pipelines where the PR-title
  #   mechanism has nothing to read.
  - name: versioningStrategy
    type: string
    default: semver
    values:
      - semver
      - git-sha

jobs:
  - job: Versioning
    steps:
    - checkout: self
      clean: true
      persistCredentials: true
    - template: ../steps/resolve_gitflow_context.yml
      parameters:
        gitFlowType: ${{ parameters.gitFlowType }}
        defaultIncrement: ${{ parameters.versionIncrement }}
        developIncrement: ${{ parameters.developIncrement }}
        releaseIncrement: ${{ parameters.releaseIncrement }}
        hotfixIncrement: ${{ parameters.hotfixIncrement }}
        versioningStrategy: ${{ parameters.versioningStrategy }}

    - ${{ if eq(parameters.versioningStrategy, 'git-sha') }}:
      - bash: |
          SHA=$(git rev-parse --short=7 HEAD)
          echo "Using git-sha versioning strategy: $SHA"
          echo "##vso[task.setvariable variable=releaseVersion;]$SHA"
          echo "##vso[task.setvariable variable=DockerTag;isOutput=true]$SHA"
        name: version
        displayName: 'Record artifact version (git-sha)'
      - bash: echo "##vso[build.updatebuildnumber]$(Build.Repository.Name) $(Build.SourceBranchName)-$(releaseVersion)"
        displayName: Update pipeline name
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      - bash: echo "##vso[build.updatebuildnumber]$(Build.Repository.Name) PR $(System.PullRequest.PullRequestId).$(System.PullRequest.PullRequestIteration)"
        displayName: Update PR pipeline name
        condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
      - bash: echo "##vso[task.setvariable variable=Version;isOutput=true]$(releaseVersion)"
        displayName: Save version
        name: semantic

    - ${{ if eq(parameters.versioningStrategy, 'semver') }}:
      - template: ../steps/set_version_increment.yml
        parameters:
          versionIncrement: ${{ parameters.versionIncrement }}
      # Apply git flow branch-specific increment when PR title did not override
      - bash: |
          echo "Applying git flow increment: $(gitflow.versionIncrement)"
          echo "##vso[task.setvariable variable=versionIncrement;]$(gitflow.versionIncrement)"
        displayName: 'Apply git flow version increment'
        condition: and(succeeded(), ne(variables['gitflow.versionIncrement'], 'none'), ne(variables['gitflow.versionIncrement'], ''), eq(variables['versionIncrementFromPR'], ''))
      - bash: |
          test -f "$(Build.SourcesDirectory)/${{ parameters.jsonFile }}" || echo '{"version": "0.0.0"}' > "$(Build.SourcesDirectory)/${{ parameters.jsonFile }}"
          git add "${{ parameters.jsonFile }}"
        displayName: Create file ${{ parameters.jsonFile }} if it does not exist
      # Remplace LoadJsonVariables@2 (Node 10, en fin de vie) : pose cicd_version
      # à partir du champ "version" du fichier. jq si présent, sinon node (déjà
      # requis par l'étape semver ci-dessous) pour les agents auto-hébergés sans jq.
      - bash: |
          set -euo pipefail
          JSON_FILE='${{ parameters.jsonFile }}'
          if command -v jq >/dev/null 2>&1; then
            VERSION=$(jq -r '.version // empty' "$JSON_FILE")
          else
            VERSION=$(node -e 'const v = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version; if (v != null) console.log(v)' "$JSON_FILE")
          fi
          if [ -z "$VERSION" ]; then
            echo "##vso[task.logissue type=error]Champ \"version\" absent de $JSON_FILE"
            exit 1
          fi
          echo "Version actuelle : $VERSION"
          echo "##vso[task.setvariable variable=cicd_version]$VERSION"
        displayName: Load current version
      # Installation dans un préfixe npm propre au job (Agent.TempDirectory) plutôt
      # qu'en global : sur un agent auto-hébergé non root, `npm install -g` écrit
      # dans /usr/lib/node_modules et échoue en EACCES.
      - bash: |
          SEMVER_PREFIX="$(Agent.TempDirectory)/semver-cli"
          npm install --global --prefix "$SEMVER_PREFIX" --no-audit --no-fund semver@7
          echo "##vso[task.prependpath]$SEMVER_PREFIX/bin"
        displayName: Install semver
      - bash: |
          set -euo pipefail
          NEW_VERSION=$(semver "$(cicd_version)" -i "$(versionIncrement)")
          echo "$(cicd_version) -> $NEW_VERSION ($(versionIncrement))"
          echo "##vso[task.setvariable variable=releaseVersion;]$NEW_VERSION"
        displayName: Bump version
        condition: and(succeeded(), ne(variables['gitflow.versionIncrement'], 'none'))
      - bash: |
          echo "No version bump — using existing version: $(cicd_version)"
          echo "##vso[task.setvariable variable=releaseVersion;]$(cicd_version)"
        displayName: 'Use existing version (no bump)'
        condition: and(succeeded(), eq(variables['gitflow.versionIncrement'], 'none'))
      - bash: |
          VERSION="$(releaseVersion)"
          SUFFIX="$(gitflow.versionSuffix)"
          if [ -n "$SUFFIX" ]; then
            FULL_VERSION="${VERSION}${SUFFIX}"
          else
            FULL_VERSION="${VERSION}"
          fi
          echo "##vso[task.setvariable variable=DockerTag;isOutput=true]$(echo "$FULL_VERSION" | tr '[:upper:]' '[:lower:]')"
        name: version
        displayName: 'Record artifact version'

      - bash: echo "##vso[build.updatebuildnumber]$(Build.Repository.Name) $(Build.SourceBranchName)-$(releaseVersion)"
        displayName: Update pipeline name
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      - bash: echo "##vso[build.updatebuildnumber]$(Build.Repository.Name) PR $(System.PullRequest.PullRequestId).$(System.PullRequest.PullRequestIteration)"
        displayName: Update PR pipeline name
        condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))

      - bash: echo "##vso[task.setvariable variable=Version;isOutput=true]$(releaseVersion)"
        displayName: Save version
        name: semantic
