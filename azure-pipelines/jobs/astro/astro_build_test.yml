parameters:
  - name: sonarKey
    type: string
    default: ''
  - name: nodeVersion
    type: string
    default: '20.x'
  - name: projectVersion
    type: string
  - name: jsonFile
    type: string
  - name: sonarConnection
    type: string
    default: Sonar
  - name: packageManager
    type: string
    default: npm
    values:
      - npm
      - yarn
  - name: typecheckScript
    displayName: npm/yarn script name for `astro check`
    type: string
    default: 'typecheck'
  - name: buildScript
    type: string
    default: build
  # Astro sites in the wild rarely ship unit tests (verified across 4 real
  # consumer repos) — off by default, but the capability stays available for
  # a project that later adds Vitest or similar.
  - name: enableTests
    displayName: Run a test script after typecheck/build
    type: boolean
    default: false
  - name: testScript
    type: string
    default: test
  - name: buildEnvVars
    displayName: Extra env vars for typecheck/build, one KEY=VALUE per line (e.g. a monorepo client selector)
    type: string
    default: ''

jobs:
  - job: Build_Typecheck
    timeoutInMinutes: 30
    steps:
    - checkout: self
      clean: true
      persistCredentials: true
    - template: ../../steps/set_version_file.yml
      parameters:
        jsonFile: ${{ parameters.jsonFile }}
        releaseVersion: ${{ parameters.projectVersion }}

    - task: NodeTool@0
      displayName: 'Use Node.js ${{ parameters.nodeVersion }}'
      inputs:
        versionSpec: '${{ parameters.nodeVersion }}'

    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: '$(Pipeline.Workspace)/.npm'
      condition: eq('${{ parameters.packageManager }}', 'npm')

    - task: Cache@2
      displayName: 'Cache yarn packages'
      inputs:
        key: 'yarn | "$(Agent.OS)" | yarn.lock'
        restoreKeys: 'yarn | "$(Agent.OS)"'
        path: '$(Pipeline.Workspace)/.yarn'
      condition: eq('${{ parameters.packageManager }}', 'yarn')

    - script: npm ci
      displayName: 'Install dependencies (npm)'
      condition: eq('${{ parameters.packageManager }}', 'npm')

    - script: yarn install --frozen-lockfile
      displayName: 'Install dependencies (yarn)'
      condition: eq('${{ parameters.packageManager }}', 'yarn')

    - script: |
        v='${{ parameters.projectVersion }}'
        if echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
          npm version "$v" --no-git-tag-version
        else
          echo "Version '$v' is not semver (git-sha strategy); leaving package.json unchanged"
        fi
      displayName: 'Set package version'

    - ${{ if ne(parameters.sonarKey, '') }}:
      - task: SonarQubePrepare@5
        displayName: 'Prepare Sonar'
        inputs:
          SonarQube: '${{ parameters.sonarConnection }}'
          scannerMode: 'CLI'
          configMode: 'manual'
          cliProjectKey: ${{ parameters.sonarKey }}
          cliSources: 'src'
          cliProjectName: $(Build.Repository.Name)
          extraProperties: |
            sonar.projectVersion=${{ parameters.projectVersion }}

    - script: |
        set -a
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          export "$key=$value"
        done <<< "${{ parameters.buildEnvVars }}"
        set +a
        npm run ${{ parameters.typecheckScript }}
      displayName: 'Typecheck (astro check) — npm'
      condition: eq('${{ parameters.packageManager }}', 'npm')

    - script: |
        set -a
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          export "$key=$value"
        done <<< "${{ parameters.buildEnvVars }}"
        set +a
        yarn ${{ parameters.typecheckScript }}
      displayName: 'Typecheck (astro check) — yarn'
      condition: eq('${{ parameters.packageManager }}', 'yarn')

    - ${{ if eq(parameters.enableTests, true) }}:
      - script: npm run ${{ parameters.testScript }}
        displayName: 'Run tests — npm'
        condition: eq('${{ parameters.packageManager }}', 'npm')

      - script: yarn ${{ parameters.testScript }}
        displayName: 'Run tests — yarn'
        condition: eq('${{ parameters.packageManager }}', 'yarn')

    - script: |
        set -a
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          export "$key=$value"
        done <<< "${{ parameters.buildEnvVars }}"
        set +a
        npm run ${{ parameters.buildScript }}
      displayName: 'Build (astro build) — npm'
      condition: eq('${{ parameters.packageManager }}', 'npm')

    - script: |
        set -a
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          export "$key=$value"
        done <<< "${{ parameters.buildEnvVars }}"
        set +a
        yarn ${{ parameters.buildScript }}
      displayName: 'Build (astro build) — yarn'
      condition: eq('${{ parameters.packageManager }}', 'yarn')

    - ${{ if ne(parameters.sonarKey, '') }}:
      - task: SonarQubeAnalyze@5
        displayName: 'Sonar analysis'
      - task: SonarQubePublish@5
        displayName: 'Sonar publish'
        inputs:
          pollingTimeoutSec: '300'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)'
        artifact: 'drop'
        publishLocation: 'pipeline'
