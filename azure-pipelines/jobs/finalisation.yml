parameters:
  - name: releaseVersion
    type: string
  - name: jsonFile
    type: string
  - name: language
    type: string
  - name: projectFile
    type: string
    default: ''
  - name: shouldTag
    type: string
    default: 'true'
  - name: gitUserEmail
    type: string
    default: 'ci-service@example.com'
  - name: gitUserName
    type: string
    default: 'CI Service'

jobs:
  - job: Finalization
    steps:
      - checkout: self
        clean: true
        persistCredentials: true
      - template: ../steps/set_version_file.yml
        parameters:
          jsonFile: ${{parameters.jsonFile}}
          releaseVersion: ${{parameters.releaseVersion}}
      
      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
        displayName: 'Install Node.js'
        condition: or(eq('${{parameters.language}}', 'angular'), eq('${{parameters.language}}', 'node'))

      - script: |
          v='${{ parameters.releaseVersion }}'
          if echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            npm ci
            npm version "$v" --no-git-tag-version
          else
            echo "Version '$v' is not semver (git-sha strategy); leaving package.json unchanged"
          fi
        displayName: 'Update Node/Angular version'
        condition: or(eq('${{parameters.language}}', 'angular'), eq('${{parameters.language}}', 'node'))

      # Bash plutôt que PowerShell : pwsh n'est pas installé sur les agents auto-hébergés Linux.
      # Seule la partie numérique de la version (sans suffixe -rc, -SNAPSHOT…) est valide pour AssemblyVersion.
      - bash: |
          PROJECT_FILE='${{ parameters.projectFile }}'
          VERSION='${{ parameters.releaseVersion }}'
          ASSEMBLY_VERSION="${VERSION%%-*}"
          if ! echo "$ASSEMBLY_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Version '$VERSION' non numérique (stratégie git-sha ?) : AssemblyVersion inchangée"
          elif grep -q '<AssemblyVersion>' "$PROJECT_FILE"; then
            sed -i "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$ASSEMBLY_VERSION</AssemblyVersion>|" "$PROJECT_FILE"
            grep '<AssemblyVersion>' "$PROJECT_FILE"
          else
            echo "Pas de <AssemblyVersion> dans $PROJECT_FILE : rien à mettre à jour"
          fi
        displayName: 'Assembly Version Generation'
        condition: eq('${{parameters.language}}', '.net')

      - script: |
          if [ -f pyproject.toml ]; then
            sed -i "s/^version = \".*\"/version = \"${{ parameters.releaseVersion }}\"/" pyproject.toml
          elif [ -f setup.cfg ]; then
            sed -i "s/^version = .*/version = ${{ parameters.releaseVersion }}/" setup.cfg
          elif [ -f setup.py ]; then
            sed -i "s/version=['\"].*['\"]/version='${{ parameters.releaseVersion }}'/" setup.py
          fi
        displayName: 'Update Python version'
        condition: eq('${{parameters.language}}', 'python')

      - script: |
          mvn versions:set -B -ntp -DnewVersion=${{ parameters.releaseVersion }} -DgenerateBackupPoms=false
        displayName: 'Update Maven POM version'
        condition: eq('${{parameters.language}}', 'maven')

      - bash: |
          git config --global user.email "${{ parameters.gitUserEmail }}"
          git config --global user.name "${{ parameters.gitUserName }}"
        displayName: Set Git User
      - task: CmdLine@1
        displayName: Commit version
        inputs:
          filename: git
          arguments: 'commit -am "***NO_CI*** Set release version to ${{parameters.releaseVersion}}"'
      - task: CmdLine@1
        displayName: Tag version
        inputs:
          filename: git
          arguments: 'tag -fa $(Build.SourceBranchName)-${{parameters.releaseVersion}} -m ${{parameters.releaseVersion}}'
        condition: and(succeeded(), eq('${{ parameters.shouldTag }}', 'true'))
      - task: CmdLine@1
        displayName: Push commit and tag
        inputs:
          filename: git
          arguments: '-c push.default=simple push origin HEAD:$(Build.SourceBranch) --follow-tags'