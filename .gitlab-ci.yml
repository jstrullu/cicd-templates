# CICD-2 — Hello GitLab : pipeline minimal pour apprivoiser GitLab CI
# avant de porter quoi que ce soit de .NET dessus (même logique que MAUI
# mis en dernier sur Belote : ne pas cumuler "apprendre le provider" et
# "porter la stack" dans le même ticket).
#
# CICD-3/4/5 : le build+test .NET a été extrait en template réutilisable
# (gitlab-ci/dotnet_pipeline.yml) — ce fichier racine le consomme via
# include local, pour se prouver soi-même que le mécanisme include/inputs
# fonctionne avant qu'un autre projet ne le fasse en cross-repo.

include:
  - local: 'gitlab-ci/dotnet_pipeline.yml'
    inputs:
      dotnetSdkVersion: '10.0'

stages:
  - hello
  - build
  - test

hello_world:
  stage: hello
  image: alpine:3
  script:
    - echo "Hello GitLab — cicd-templates CICD-2"
